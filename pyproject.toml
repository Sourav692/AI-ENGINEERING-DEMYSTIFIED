[project]
name = "ai_engineering_roadmap"
version = "0.2.0"
description = "AI Engineering - an end-to-end, 13-phase roadmap from foundations to production"
requires-python = ">=3.11"
# Floors below mirror the resolved pins in requirements.txt (the pinned mirror);
# requirements.lock.txt holds the full 548-package transitive lock.
dependencies = [
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.6.0",
    "langchain-anthropic>=1.7.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-chroma>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langchain-mcp-adapters>=0.3.2",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.4",
    "langsmith>=0.12.1",
    "deepagents>=0.7.13",
    "openai>=2.54.0",
    "anthropic>=1.3.0",
    "groq>=0.37.1",
    "google-genai>=2.22.0",
    "databricks-langchain>=0.20.0",
    "databricks-sdk>=0.135.0",
    "databricks-vectorsearch>=0.75",
    "databricks-ai-bridge>=0.21.0",
    "mcp>=1.29.1",
    "chromadb>=1.5.9",
    "tavily-python>=0.8.1",
    "wikipedia>=1.4.0",
    "rank-bm25>=0.2.2",
    "pypdf>=6.17.0",
    "beautifulsoup4>=4.15.0",
    "tiktoken>=0.14.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "typing-extensions>=4.16.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "aiofiles>=25.1.0",
    "tenacity>=9.1.4",
    "rich>=14.3.4",
    "tqdm>=4.70.0",
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
    "orjson>=3.12.0",
    "jsonlines>=4.0.0",
    "tabulate>=0.9.0",
    "prettytable>=3.18.0",
    "validators>=0.35.0",
    "grandalf>=0.8",
    "nest-asyncio>=1.6.0",
    "websockets>=15.0.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "sqlalchemy>=2.0.52",
    "ipython>=9.17.1",
]

[project.optional-dependencies]
# Additional model providers (AWS Bedrock, Fireworks, Cohere, LiteLLM, Vertex AI)
providers = [
    "langchain-aws>=1.7.5",
    "langchain-fireworks>=1.6.1",
    "cohere>=7.1.1",
    "litellm>=1.99.0",
    "google-generativeai>=0.8.6",
    "google-api-python-client>=2.200.0",
    "google-cloud-aiplatform>=2.1.0",
    "boto3>=1.43.88",
]
# Phase 9 — agent protocols (MCP servers/clients, A2A, Google ADK)
protocols = [
    "fastmcp>=3.4.7",
    "a2a-sdk>=1.1.2",
    "google-adk>=2.7.0",
    "databricks-mcp>=0.9.2",
]
# Phase 10 — alternative agent frameworks + Phase 7 memory/swarm
frameworks = [
    "autogen-agentchat>=0.7.5",
    "autogen-core>=0.7.5",
    "autogen-ext>=0.7.5",
    "mem0ai>=2.0.20",
    "langgraph-swarm>=0.1.0",
    "langmem>=0.0.30",
]
# Phases 4/8 — extra vector stores, retrievers and document loaders
retrieval = [
    "langchain-pinecone>=0.2.13",
    "langchain-postgres>=0.0.17",
    "langgraph-checkpoint-postgres>=3.1.2",
    "faiss-cpu>=1.15.0",
    "neo4j>=6.3.0",
    "pgvector>=0.3.6",
    "duckduckgo-search>=8.1.1",
    "arxiv>=4.0.1",
    "youtube-transcript-api>=1.2.4",
    "pypdf2>=3.0.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "docx2txt>=0.9",
    "unstructured>=0.27.5",
    "markitdown>=0.1.7",
    "markdownify>=1.2.3",
    "readabilipy>=0.3.0",
    "reportlab>=5.0.1",
    "langextract>=1.6.0",
]
# Phase 1 — Hugging Face ecosystem, fine-tuning and local models (large: pulls torch)
hf = [
    "huggingface-hub>=1.16.1",
    "transformers>=5.16.1",
    "diffusers>=0.39.0",
    "accelerate>=1.14.0",
    "peft>=0.20.0",
    "trl>=1.12.0",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "tokenizers>=0.23.2",
    "safetensors>=0.8.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "torchaudio>=2.11.0",
    "openai-whisper>=20250625",
]
# Databricks Connect / SQL / Unity Catalog (macOS default provider track)
databricks = [
    "databricks-connect>=18.0.0",
    "databricks-sql-connector>=4.5.0",
    "unitycatalog-ai>=0.3.0",
    "unitycatalog-langchain>=0.3.0",
]
# Phase 7 / 12 — evaluation, tracing and red-teaming
eval = [
    "deepeval>=4.2.1",
    "deepteam>=1.0.9",
    "ragas>=0.4.3",
    "mlflow>=3.16.0",
    "arize-phoenix>=20.3.0",
    "arize-phoenix-otel>=0.17.1",
    "openinference-instrumentation-openai>=0.1.57",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "sentry-sdk>=2.68.1",
    "pyrit>=1.0.1",
]
# Data science and plotting used across notebooks
data = [
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "matplotlib>=3.11.1",
    "altair>=6.2.2",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.5",
    "networkx>=3.6.1",
    "numexpr>=2.14.2",
    "yfinance>=1.7.0",
]
# Phase 13 — FastAPI/Flask services, Postgres/MySQL/Redis persistence
fullstack = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "starlette>=1.6.0",
    "sse-starlette>=3.4.10",
    "python-multipart>=0.0.32",
    "psycopg[binary]>=3.3.5",
    "psycopg-pool>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.1",
    "pymysql>=1.2.0",
    "mysql-connector-python>=26.7.0",
    "redis>=8.1.0",
    "alembic>=1.19.1",
    "sqlalchemy-utils>=0.42.1",
    "docker>=7.2.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "waitress>=3.0.2",
]
# Streamlit / Gradio apps
apps = [
    "streamlit>=1.63.0",
    "streamlit-agraph>=0.0.45",
    "streamlit-chat>=0.1.1",
    "streamlit-mic-recorder>=0.0.8",
    "gradio>=6.26.0",
]
# Notebooks, tests and linting
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "notebook>=7.6.2",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "black>=26.5.1",
    "isort>=9.0.1",
]
# Install everything — reproduces the full requirements.txt set
all = [
    "ai_engineering_roadmap[providers,protocols,frameworks,retrieval,hf,databricks,eval,data,fullstack,apps,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpers"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "archive",
    "13_Projects/LangGraph_Fullstack_Capstone/fullstackapp/frontend",
    "13_Projects/LangChain_Microservices_Capstone/frontend",
    "07_Advanced_Agentic_Systems/Deep_Agents_and_Harness_Engineering/app/frontend",
    "10_Alternative_Agent_Frameworks/CrewAI/01_Foundations/Some_Simple_Agents/app/frontend",
    "13_Projects/Realtime_Voice_AI_Agent_with_RAG/Codes/rag_voice_ai_agent-deployment_live/frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
