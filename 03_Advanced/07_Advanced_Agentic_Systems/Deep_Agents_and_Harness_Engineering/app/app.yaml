# Databricks App configuration.
# Deployed via the bundle in /databricks.yml (target = dev|staging|prod).

command:
  - uvicorn
  - deep_agent.main:app
  - --app-dir
  - backend/src
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: TAVILY_API_KEY
    valueFrom: tavily-api-key
  - name: DATABRICKS_HOST
    valueFrom: DATABRICKS_HOST
  - name: DATABRICKS_TOKEN
    valueFrom: DATABRICKS_TOKEN
  - name: LAKEBASE_INSTANCE_NAME
    value: deep-agent-memory
  - name: LAKEBASE_DATABASE
    value: databricks_postgres
  # Genie space IDs are workspace-specific and never committed. Attach the four
  # Genie spaces to the app as resources (App → Edit → Resources → Genie space,
  # permission CAN_RUN) using exactly these resource keys; valueFrom injects each ID.
  - name: GENIE_SPACE_CUSTOMER_ANALYTICS
    valueFrom: genie-customer-analytics
  - name: GENIE_SPACE_DISTRIBUTION_CHANNELS
    valueFrom: genie-distribution-channels
  - name: GENIE_SPACE_POLICY_UNDERWRITING
    valueFrom: genie-policy-underwriting
  - name: GENIE_SPACE_CLAIMS_ANALYTICS
    valueFrom: genie-claims-analytics

resources:
  - name: lakebase-memory
    description: "Lakebase Postgres for long-term memory"
    database:
      instance_name: deep-agent-memory
      database_name: databricks_postgres
      permission: CAN_CONNECT_AND_CREATE
  - name: tavily-api-key
    description: "Tavily web search API key"
    secret:
      scope: deep-agent
      key: tavily-api-key
      permission: READ
