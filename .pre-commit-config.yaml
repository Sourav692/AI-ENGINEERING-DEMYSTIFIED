# Pre-commit hooks for the AI Engineering roadmap.
#
# Activate once, per clone:
#     uv pip install -r requirements.txt      # or: uv pip install -e ".[dev]"
#     pre-commit install
#
# Installing the packages is NOT enough — until `pre-commit install` is run in
# your clone, these hooks do nothing.
#
# Why nbstripout: notebooks here ship with cleared outputs so a learner runs them
# fresh, and because saved outputs leak. Committed outputs in this repo carried
# absolute filesystem paths that exposed a local directory tree and the name of
# an unrelated private repo. Clearing them by hand is a mop; this is the fix.
#
# Scope is repo-wide by explicit decision, `archive/` included: the point is that
# no notebook anywhere can carry outputs into a commit.

repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: strip output from notebooks
        # Defaults only, deliberately. Verified on a real notebook from this
        # repo: outputs are emptied, execution_count is nulled, and cell
        # `metadata.tags` SURVIVE — which matters, because the LangChain-1.x
        # explainers tag their 0.x contrast cells `raises-exception` and
        # `langchain-0x-contrast`, and both the migration scanner and the
        # bulk-edit scripts key off those tags. Notebook-level `kernelspec` is
        # also kept, so notebooks still declare their kernel.

  # Structural invariants. Every check guards something that has actually broken
  # in this repo, silently: a folder rename that left .gitignore protecting
  # nothing, notebooks moved a directory deeper than their relative data/ paths
  # assumed, index docs naming folders that had been renamed weeks earlier, and
  # a 0-byte notebook that sat tracked for weeks. None of those raise an error on
  # their own — that is the whole reason this hook exists.
  #
  # Runs repo-wide on every commit (pass_filenames: false), not just on staged
  # files: a rename in one folder breaks a reference in another. ~0.6s over 526
  # notebooks, so the cost is not worth optimising away.
  - repo: local
    hooks:
      - id: repo-invariants
        name: check repo structural invariants
        entry: python3 scripts/check_repo_invariants.py
        language: system
        pass_filenames: false
        always_run: true

  # Scripted notebook edits can emit invalid JSON, and an empty file is not a
  # notebook. Enabled 2026-09-19 after a 0-byte .ipynb was found tracked in
  # 05_Projects/RAG_Systems_Projects/ — nbstripout rejected it at commit time
  # with "No valid notebook detected", which is a confusing place to learn it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        files: \.ipynb$

