# Pre-commit hooks for the AI Engineering roadmap.
#
# Activate once, per clone:
#     uv pip install -r requirements.txt      # or: uv pip install -e ".[dev]"
#     pre-commit install
#
# Installing the packages is NOT enough — until `pre-commit install` is run in
# your clone, these hooks do nothing.
#
# Why nbstripout: notebooks here ship with cleared outputs so a learner runs them
# fresh, and because saved outputs leak. Committed outputs in this repo carried
# absolute filesystem paths that exposed a local directory tree and the name of
# an unrelated private repo. Clearing them by hand is a mop; this is the fix.
#
# Scope is repo-wide by explicit decision, `archive/` included: the point is that
# no notebook anywhere can carry outputs into a commit.

repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: strip output from notebooks
        # Verified on a real notebook from this repo: outputs are emptied,
        # execution_count is nulled, and cell `metadata.tags` SURVIVE — which
        # matters, because the LangChain-1.x explainers tag their 0.x contrast
        # cells `raises-exception` and `langchain-0x-contrast`, and both the
        # migration scanner and the bulk-edit scripts key off those tags.
        #
        # The two --extra-keys below strip the volatile *kernel label* fields.
        # `kernelspec.name` and `kernelspec.language` are NOT stripped, so a
        # notebook still declares which kernel it wants — only the cosmetic
        # parts go.
        #
        # Why: `display_name` records whatever the last editor's environment
        # happened to be called. Across this repo it had drifted to twelve
        # different values — `.venv` (311 notebooks), `Python 3` (109),
        # `Python 3 (ipykernel)` (79), `base` (40), plus machine-specific ones
        # like `RAGUdemy` and `udemycourse`. It carries no information, differs
        # per machine, and re-dirties a notebook every time an IDE opens it.
        # `language_info.version` is the same problem with a patch number.
        args:
          - --extra-keys
          - metadata.kernelspec.display_name metadata.language_info.version

# ---------------------------------------------------------------------------
