   ["One agent, more tools","A long tool list can confuse selection","Simplest, cheapest, easiest to debug","Almost always — start here"],
   ["Multi-agent","Coordination, latency, new failures","Parallelism, role isolation","You can name which you need"]],
   o:"I use multiple agents when I can name what I'm buying. Otherwise it's one agent with more tools."},
  {t:"Supervisor versus handoff",h:["Option","Costs you","Buys you","Pick when"],r:[
   ["Supervisor","One model call per hop","Central plan, easy to audit","The work needs orchestrating"],
   ["Handoff","No global view of progress","Cheaper, natural for conversation","Control should transfer"]],
   o:"Supervisor when someone needs to hold the plan, handoff when the conversation itself should move."},
  {t:"Parallel versus sequential",h:["Option","Costs you","Buys you","Pick when"],r:[
   ["Sequential","Latency is the sum","Later agents see earlier results","Steps genuinely depend on each other"],
   ["Parallel","Merge logic, partial failure","Latency of the slowest","Subtasks are independent"]],
   o:"Parallel only when no agent needs another's output — otherwise you're paying for concurrency you can't use."},
  {t:"Flat versus hierarchical",h:["Option","Costs you","Buys you","Pick when"],r:[
   ["Flat","Router degrades with many choices","One routing call per hop","Under roughly five agents"],
   ["Hierarchical","A routing call per level","Each decision stays small","Many agents in clear groups"]],
   o:"Add a level when one router has too many choices, and accept a call per level before any work."}],
 qs:[
  {r:["core","agentic"],q:"When is multi-agent actively worse than one agent with more tools?",a:"<p>Usually. Multi-agent adds coordination overhead, message-passing latency, and a failure class single agents don't have — agents waiting on a peer that never signals done.</p><p>Justify it only for genuine parallelism over independent subtasks, distinct tool permissions per role, or context one agent can't hold. This question exists to catch architecture-by-fashion.</p>",s:[["galileo","https://galileo.ai/blog/why-multi-agent-systems-fail"],["callsphere","https://callsphere.ai/blog/agentic-ai-multi-agent-interview-questions-2026"]]},
  {r:["core","agentic"],q:"Your supervisor and worker are stuck rejecting and retrying. Diagnose it.",a:"<p>This is the canonical multi-agent failure. The supervisor rejects, the worker retries the same way, the supervisor rejects again — budget burns with no progress.</p><p>Fix in layers: a hard hop cap returning partial results, a no-progress check for the same agent receiving the same input twice, and feedback specific enough for the worker to actually change approach.</p>",s:[["galileo","https://galileo.ai/blog/why-multi-agent-systems-fail"]]},
  {r:["core","agentic"],q:"How do agents communicate?",a:"<p>Through shared state, not direct calls. Each agent reads state and returns updates; the graph merges them using reducers and decides who runs next.</p><p>Say the consequence: any key more than one agent writes needs a reducer, or updates are silently lost. Direct agent-to-agent calls would remove the graph's ability to checkpoint and resume.</p>",s:[["LangGraph 2026","https://medium.com/@dewasheesh.rana/langgraph-explained-2026-edition-ea8f725abff3"]]},
  {r:["core","fde"],q:"Your multi-agent system is accurate but too expensive. Trim it without hiding failure.",a:"<p>Account first: cost per run split by agent and hop, so you know if it's routing calls, agent calls or retries.</p><p>Then the cheap wins — collapse agents whose only job is passing messages along, route only hard steps to the expensive model, cache prefixes, pass summaries instead of full history. Every cut ships with an eval number showing quality held.</p>",s:[["systemdesignhandbook","https://www.systemdesignhandbook.com/guides/agentic-system-design/"]]},
  {r:["core","agentic"],q:"Ten agents run in parallel, one fails. What happens?",a:"<p>Whatever you decided in advance — and the point of the question is whether you decided at all.</p><p>Options are abort the batch, or return partial results with the failure attached. For research tasks, partial plus an explicit gap note is usually right. The wrong answer is losing nine successes to one failure because you never chose.</p>",s:[["systemdesignhandbook","https://www.systemdesignhandbook.com/guides/agentic-system-design/"]]},
  {r:["core","agentic"],q:"How do you stop the whole system running forever?",a:"<p>Termination needs care in both directions: stopping early abandons solvable work, never stopping burns money on unsolvable work.</p><p>Combine an explicit done signal from the supervisor, hard ceilings on hops and total model calls, and progress checks. Every ceiling returns partial results with a reason rather than raising.</p>",s:[["galileo","https://galileo.ai/blog/why-multi-agent-systems-fail"]]},
  {r:["core","applied"],q:"Design a research system with a supervisor and workers.",a:"<p>Supervisor plans N queries, workers execute independently in parallel, a synthesiser merges. State carries findings with operator.add so parallel writes accumulate. Bound it with a hop cap and a per-run model-call budget.</p><p>Then volunteer the honest tradeoff: the supervisor's planning call is pure overhead if the decomposition was predictable, in which case hardcode it.</p>",s:[["field guide","https://github.com/alexeygrigorev/ai-engineering-field-guide/blob/main/interview/questions/04-ai-system-design.md"]]},
  {r:["core","agentic","fde"],q:"Where do guardrails live in a multi-agent system?",a:"<p>Outside the model, at the graph level. Validate tool arguments before execution, enforce per-agent tool permissions in the runtime rather than in prompts, and require human approval for irreversible actions.</p><p>The principle: the model proposes, the system decides. Per-agent permissions are one of the few genuinely good reasons to split agents at all.</p>",s:[["galileo","https://galileo.ai/blog/why-multi-agent-systems-fail"]]},
  {r:["agentic","fde"],q:"How do you debug a multi-agent run that produced a bad answer?",a:"<p>A trace keyed by run ID, recording per hop: which agent ran, why the supervisor chose it, what it saw, what it returned.</p><p>The supervisor's reasoning field is the highest-value thing to log, because most bad multi-agent outputs are bad <i>routing</i> rather than bad agents. Then find the first hop where the trajectory diverged.</p>",s:[["Agentic guide 2026","https://atul4u.medium.com/the-complete-agentic-ai-system-design-interview-guide-2026-f95d0cfeb7cf"]]},
  {r:["applied","agentic"],q:"How would you evaluate a multi-agent system?",a:"<p>Two levels. Outcome evaluation asks whether the final answer was right. Trajectory evaluation asks whether it took a sensible path — did the supervisor route correctly, did agents stay in role, how many hops.</p><p>Trajectory matters more here, because a system reaching the right answer through six wasted hops is one prompt change from not reaching it.</p>",s:[["KDnuggets","https://www.kdnuggets.com/how-to-answer-ai-system-design-interview-questions"]]}],
 self:[["How do agents communicate?","Shared state, not direct calls."],
  ["What breaks without a reducer on a parallel key?","All but one result is lost."],
  ["Supervisor vs handoff in one line?","Central plan vs control transferring."],
  ["What does a supervisor cost per hop?","One extra model call."],
  ["Why constrain routing with a Literal?","The model can't route to a non-existent agent."],
  ["The canonical multi-agent failure?","Supervisor-worker rejection loop with no progress."],
  ["Three defences against it?","Hop cap, no-progress check, specific feedback."],
  ["What makes a fan-out a fan-in?","Several edges into one node; it waits for all."],
  ["What does hierarchy cost?","One routing call per level, before any work."],
  ["When do you collapse agents?","Shared tools, shared context, never concurrent."],
  ["Highest-value thing to log?","The supervisor's routing reasoning."],
  ["Outcome or trajectory evaluation?","Both, and trajectory matters more here."]]},

{id:"05",emoji:"🛡️",short:"Production",title:"Production & Operations",
 md:"05_production_and_operations_INTERVIEW_TUTORIAL.md",
 idea:"If you can't measure it, you can't defend it.",
 blurb:"The other four tutorials build things. This one keeps them alive, affordable, safe and measurable — and it fills the biggest gap in all four: <b>evaluation</b>. For Applied AI and FDE roles this is what separates shipped from prototyped.",
 diagram:`flowchart TD
  A["It's live. Now what?"] --> B["Is it working?"]
  A --> C["What does it cost?"]
  A --> D["Can it be abused?"]
  A --> E["Did my change help?"]
  B --> B1["Metrics, latency, errors"]
  C --> C1["Routing, caching, budgets"]
  D --> D1["Injection, PII, validation"]
  E --> E1["Eval sets, regression"]`,
 dcap:"\"We'd add logging\" is the answer that fails all four",
 concepts:[
  {t:"Four metrics, and why tokens are two of them",
   b:"Output tokens typically cost several times input tokens, so merging them into one number hides your main cost lever. Cache hit rate sits alongside because it's what tells you whether the cache is worth its complexity — one at 2% is a liability.",
   code:`self.metrics = {
    "requests_total": 0, "errors_total": 0,
    "latency_sum": 0,    "latency_count": 0,
    "tokens_input": 0,   "tokens_output": 0,   # split, deliberately
    "cache_hits": 0,     "cache_misses": 0,
}`,
   say:"Requests, errors, latency, and tokens split input from output — because output costs several times more, so one token count hides the main lever."},
  {t:"Latency is a distribution, not a number",
   b:"If 95 requests take 1 second and 5 take 30, the mean is 2.5 and looks fine while one user in twenty suffers. <b>p95</b> and <b>p99</b> are what users feel. And time to first token is a different metric from total time, with different fixes — streaming improves the first and does nothing for the second.",
   diagram:`flowchart LR
  subgraph TTFT["Time to first token — streaming improves this"]
    A["Request"] --> B["Retrieval"] --> C["Prefill"] --> D["First token"]
  end
  subgraph REST["Total time — unchanged by streaming"]
    D --> F["Decode the rest"] --> G["Complete"]
  end`,
   say:"I alert on p95 and p99, not the mean. And I separate time to first token from total — different causes, different fixes."},
  {t:"Model routing is the biggest cost lever",
   b:"Classify the request, send easy ones to a cheap model. The catch to volunteer: the classifier is <i>itself</i> a model call, so if most traffic is complex you pay to classify and then pay full price anyway. Measure the split first, and prefer a free heuristic where one exists.",
   code:`class ModelRouter:
    def __init__(self):
        self.cheap_model     = ChatOpenAI(model="gpt-4o-mini")
        self.expensive_model = ChatOpenAI(model="gpt-4o")
        self.classifier      = ChatOpenAI(model="gpt-4o-mini")  # costs too!`,
   say:"Routing is usually the biggest lever, but the classifier is itself a call, so it only pays when enough traffic is genuinely simple."},
  {t:"Two kinds of caching, and one is underrated",
   b:"<b>Exact-match</b> response caching rarely hits — natural language doesn't repeat verbatim. <b>Prefix caching</b> almost always helps and just requires stable content first in the prompt. <b>Embedding</b> caching has the clearest payoff, on reingestion.",
   say:"Exact-match rarely hits unless queries repeat verbatim. Prefix caching almost always helps and just needs stable content first."},
  {t:"Prompt injection is an input-validation problem",
   b:"Untrusted input reaches the model through the same channel as your instructions. Be honest about regex filters: they catch naive attempts and miss encodings, other languages, and indirect injection through retrieved documents. The real defence is never letting model output be authoritative.",
   diagram:`flowchart TD
  A["User input"] --> B["Layer 1: filter"]
  R["Retrieved documents"] --> B
  B --> C["Model proposes an action"]
  C --> D["Layer 2: validate output"]
  D --> E{"Layer 3: permitted?"}
  E -->|"No"| X["Reject in code"]
  E -->|"Yes, irreversible"| H["Layer 4: human approves"]
  E -->|"Yes, safe"| Z["Execute"]
  H --> Z`,
   say:"Injection is untrusted input reaching the instruction channel. Filtering helps but can't be complete — permissions and validation live in code. And retrieved documents are untrusted input too."},
  {t:"Testing something non-deterministic",
   b:"Three layers, cheapest first. <b>Property assertions</b> are deterministic and run every commit. A <b>frozen regression set</b> runs on every change, read as a distribution. An <b>LLM judge</b> comes last, and only after you've validated it against human labels — otherwise you've automated an unmeasured opinion.",
   diagram:`flowchart TD
  A["Human review: slow, the ground truth"] --> B["LLM judge: scales, validate first"]
  B --> C["Regression set: every change"]
  C --> D["Property assertions: every commit, free"]`,
   code:`def test_returns_valid_schema():
    result = chain.invoke({"text": SAMPLE})
    assert isinstance(result, Analysis)
    assert result.sentiment in {"positive", "negative", "neutral"}
    assert 0.0 <= result.confidence <= 1.0`,
   say:"Property assertions first because they're deterministic and free. A judge last, and only after checking it against human labels."}],
 gotchas:[
  {t:"Averages hide your worst users",s:"Dashboards look healthy while support tickets pile up.",c:"Alerting on mean latency. A slow tail disappears into a good average.",f:"Alert on p95 and p99. Separate time to first token from total.",a:"\"Mean latency is 1.2s and users say it's slow. Explain.\""},
  {t:"The complexity classifier can cost more than it saves",s:"Routing is live and the bill barely moved, or went up.",c:"Every request now pays for classification. If most traffic is complex, that's pure overhead.",f:"Measure the split before building. Prefer a heuristic router when a free signal exists.",a:"\"When does model routing lose money?\""},
  {t:"Exact-match caching almost never hits",s:"Cache hit rate under 5%, complexity for nothing.",c:"Natural-language queries rarely repeat verbatim. One extra word is a miss.",f:"Measure hit rate before committing. Prefer prefix and embedding caching.",a:"\"You added a response cache and nothing improved. Why?\""},
  {t:"A regex injection filter gives false confidence",s:"It passes your test suite and fails on a real attempt.",c:"It matches known phrasings. Encodings, other languages and indirect injection bypass it.",f:"Treat it as the cheapest layer, never the only one. Real controls go in code.",a:"\"How would you get past your own injection filter?\""},
  {t:"Retrieved documents are untrusted input",s:"A poisoned document changes behaviour for every user who retrieves it.",c:"Indirect prompt injection. RAG ingests attacker-writable content by design.",f:"Treat retrieved text as data, delimit it clearly, and validate output regardless of source.",a:"\"Someone edits a Confluence page your RAG indexes. What can they do?\""},
  {t:"Exact-match assertions make flaky tests",s:"CI fails randomly; the team disables the test.",c:"Asserting an exact string from a non-deterministic system. Even temperature=0 isn't reproducible.",f:"Assert properties — schema, ranges, refusal behaviour. Save quality for the eval set.",a:"\"How do you test a system that answers differently each run?\""},
  {t:"An unvalidated judge automates an opinion",s:"Judge scores improve while users complain more.",c:"The judge was never checked against human labels, and measures something adjacent — often verbosity.",f:"Label a sample by hand, measure agreement, then trust it. Re-check on judge model changes.",a:"\"Eval scores went up and satisfaction went down. What happened?\""},
  {t:"Tracing exports customer data",s:"A security review blocks the deployment late.",c:"Tracing ships prompts and completions, including customer content, to an external service.",f:"Know your configuration before the meeting. Self-hosted, redaction, or sampling.",a:"\"Your customer is in healthcare. What breaks about your observability?\""},
  {t:"Cost alerts on absolute thresholds fire late",s:"You find out about a runaway loop from the monthly invoice.",c:"A fixed monthly threshold can't distinguish growth from a bug.",f:"Alert on a rolling baseline — daily spend above 120% of the 7-day average — plus a per-request ceiling.",a:"\"An agent loops overnight. When do you find out?\""}],
 trades:[
  {t:"Where to spend the latency budget",h:["Option","Costs you","Buys you","Pick when"],r:[
   ["Stream","Harder mid-response errors","Fast perceived response","A human reads the output"],
   ["Smaller model","Some quality","Real latency and cost cut","The task tolerates it — measure"],

   ["Do less work","Feature scope","Everything","Almost always worth checking first"]],

  {t:"Evaluation depth",h:["Option","Costs you","Buys you","Pick when"],r:[
   ["Property assertions","Won't catch quality drops","Deterministic, free","Always — this is the floor"],
   ["Frozen regression set","Labelling effort","Catches real regressions","Any system you change"],

  {t:"Security layer placement",h:["Option","Costs you","Buys you","Pick when"],r:[

   ["Human approval","Latency and someone's time","The strongest control","Irreversible actions"]],
   o:"Filtering is a speed bump, code-level permissions are the wall — and a human in front of anything irreversible."},
  {t:"Build versus buy for observability",h:["Option","Costs you","Buys you","Pick when"],r:[
   ["Roll your own","Engineering time, ongoing","Data stays in your network","Hard residency requirement"],
   ["Hosted","Data leaves your network","Working traces in an afternoon","No residency constraint"],

   o:"Hosted until a customer's data residency says otherwise — and I ask that in week one, not at the security review."}],
 qs:[
  {r:["applied","fde"],q:"What do you monitor for an LLM application, beyond normal service metrics?",a:"<p>Requests, errors and latency as usual, with three additions. Latency splits into time to first token and total. Tokens split into input and output, because output costs several times more.</p><p>And quality signals — refusal rate, fallback rate, thumbs, edit rate — because an LLM service can be perfectly healthy by infrastructure metrics while producing nonsense.</p>",s:[["LLMOps","https://createif-labs.de/en/journal/llmops-llm-betrieb"]]},
  {r:["applied","fde"],q:"How do you control cost without hurting quality?",a:"<p>Order by cheapness. Cap output length, since output tokens dominate. Cache prompt prefixes. Trim system prompts and retrieved context. Route easy queries to a cheaper model.</p><p>Then the discipline that makes it safe: every reduction ships alongside an eval number showing quality held. Cost work without evaluation is quality loss you haven't noticed yet.</p>",s:[["LLMOps","https://createif-labs.de/en/journal/llmops-llm-betrieb"]]},
  {r:["fde","agentic"],q:"When do you get alerted about a cost problem?",a:"<p>Not from the invoice. Alert on a rolling baseline — daily spend above roughly 120% of the 7-day average catches anomalies without firing on normal growth.</p><p>Add a per-request cost ceiling so a single runaway agent loop is caught in minutes. Track cost per model and per feature so the alert tells you where to look.</p>",s:[["LLMOps","https://createif-labs.de/en/journal/llmops-llm-betrieb"]]},
  {r:["core","fde"],q:"Explain prompt injection and how you defend against it.",a:"<p>Untrusted input reaches the model through the same channel as your instructions, so a user can try to override them.</p><p>Defence is layered: filter input as a cheap first pass, validate output, enforce permissions in code, require approval for irreversible actions. The principle: never treat model output as authoritative. Then mention indirect injection through retrieved documents — the case most candidates miss.</p>",s:[["Prompt Engineer Qs","https://www.crosschq.com/blog/prompt-engineer-interview-questions"],["LLMOps","https://createif-labs.de/en/journal/llmops-llm-betrieb"]]},
  {r:["applied"],q:"How do you test a non-deterministic system?",a:"<p>Three layers. Property assertions that are deterministic and run every commit — schema validity, value ranges, refusal behaviour. A frozen regression set scored on every change, read as a distribution rather than a mean.</p><p>And an LLM judge, validated against human labels before you trust it. Exact-match assertions produce flaky tests that get deleted.</p>",s:[["LLM interviews","https://medium.com/@santosh.rout.cr7/llm-engineering-interviews-how-to-prepare-for-prompting-fine-tuning-and-evaluation-df888e76340e"]]},
  {r:["applied"],q:"How do you know a prompt change made the product better?",a:"<p>A frozen eval set with expected behaviour, run on every change, with retrieval and generation measured separately where both exist.</p><p>Read the whole distribution because regressions hide in the tail. Then close the loop with online signals — thumbs, edits, follow-up rate — because offline evaluation can't see what users actually do.</p>",s:[["DataCamp","https://www.datacamp.com/blog/llm-interview-questions"]]},
  {r:["applied","fde"],q:"What is model routing and when does it pay off?",a:"<p>Classify the request and send easy ones to a cheap model. Usually the largest single cost lever, but the classifier is itself a model call, so it only pays when a meaningful share of traffic is genuinely simple.</p><p>Measure the split first. A heuristic router — query length, retrieval confidence — costs nothing and is often enough.</p>",s:[["LLMOps","https://createif-labs.de/en/journal/llmops-llm-betrieb"]]},
  {r:["fde","applied"],q:"Your p95 latency doubled overnight. Walk me through it.",a:"<p>Establish what changed: a deploy, a provider incident, or a traffic shift. Split latency by stage — retrieval, prefill, decode, tools — because the aggregate says nothing about which moved.</p><p>Check whether it's all requests or a segment, since a new customer with larger documents looks identical to a regression in aggregate. Then compare traces from before and after.</p>",s:[["LLMOps","https://createif-labs.de/en/journal/llmops-llm-betrieb"]]},
  {r:["fde"],q:"How do you handle PII in an LLM pipeline?",a:"<p>Know where it enters and everywhere it lands. It enters through user input and documents; it lands in prompts, completions, logs, traces and vector stores.</p><p>Detect and redact before it reaches any of those, and remember embeddings of PII are still PII. The vector store is the one people forget, because deleting a source document doesn't delete its vectors.</p>",s:[["LLMOps","https://createif-labs.de/en/journal/llmops-llm-betrieb"]]},
  {r:["fde","applied"],q:"What does release readiness mean for an LLM feature?",a:"<p>A frozen eval set with an agreed pass bar. Monitoring and cost alerts live before launch, not after. A documented failure mode and fallback behaviour. Injection and PII handling reviewed.</p><p>A rollback that doesn't depend on a model provider. And a named owner for the quality metric, because unowned metrics stop being watched within weeks.</p>",s:[["Release readiness","https://arxiv.org/pdf/2403.18958"]]}],
 self:[["Why split input and output tokens?","Output costs several times more."],
  ["p95 or mean, and why?","p95 — the mean hides the tail users feel."],
  ["Two latency metrics for LLMs?","Time to first token, and total time."],
  ["When does model routing lose money?","When most traffic is complex; you pay to classify anyway."],
  ["Which cache almost always helps?","Prompt prefix caching."],
  ["Why is a regex injection filter insufficient?","Encodings, other languages and indirect injection bypass it."],
  ["What is indirect prompt injection?","Untrusted instructions inside a retrieved document."],
  ["What should never be authoritative?","Model output. It proposes; code decides."],
  ["How do you test non-deterministic output?","Property assertions, then a frozen regression set."],
  ["Before trusting an LLM judge?","Validate it against human labels on a sample."],
  ["How do you alert on cost?","A rolling baseline plus a per-request ceiling."],
  ["Where does PII land besides the prompt?","Logs, traces, and the vector store."]]}
];

function tutorialHTML(t){
  return `
  <div class="mast">
    <h1>${t.emoji} ${t.title}</h1>
    <p class="sub">${t.blurb}</p>
    <div class="facts">
      <div class="fact"><b>${t.qs.length}</b><i>questions</i></div>
      <div class="fact"><b>${t.gotchas.length}</b><i>gotchas</i></div>
      <div class="fact"><b>${t.trades.length}</b><i>tradeoffs</i></div>
      <div class="fact"><b>${t.concepts.length}</b><i>concepts</i></div>
    </div>
  </div>

  <section>
    <div class="eyebrow">The mental model</div>
    <h2>${t.idea}</h2>
    ${plate(t.diagram, t.dcap)}
  </section>

  <section>
    <div class="eyebrow">Core concepts</div>
    <h2>What everything else rests on</h2>
    ${t.concepts.map((c,i)=>`<div class="concept">
      <h4><span class="n">${String(i+1).padStart(2,"0")}</span>${c.t}
        ${c.gap?'<span class="gaptag">not in your notebooks</span>':""}</h4>
      <p>${c.b}</p>
      ${c.diagram?plate(c.diagram):""}
      ${c.code?code(c.code):""}
      <div class="say"><b>Say this</b>${c.say}</div>
    </div>`).join("")}
  </section>

  <section>
    <div class="eyebrow">Gotchas</div>
    <h2>True, surprising, and costly</h2>
    <p class="lede">Symptom on the front. Click for cause, fix, and how it gets asked.</p>
    <div class="gots">${t.gotchas.map((g,i)=>`<div class="got-c" data-i="${i}" tabindex="0" role="button" aria-expanded="false">
      <h4>${g.t}</h4>
      <div class="got-row"><b>Symptom</b><span>${g.s}</span></div>
      <div class="got-back">
        <div class="got-row"><b>Cause</b><span>${g.c}</span></div>
        <div class="got-row"><b>Fix</b><span>${g.f}</span></div>
        <div class="got-row"><b>Asked as</b><span>${g.a}</span></div>
      </div>
      <div class="flip">click to flip</div></div>`).join("")}</div>
  </section>

  <section>
    <div class="eyebrow">Tradeoffs</div>
    <h2>Decisions, with the rule for choosing</h2>
    ${t.trades.map(x=>`<div class="trade"><h4>${x.t}</h4>
      <div class="tw"><table><thead><tr>${x.h.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${x.r.map(r=>`<tr>${r.map((c,i)=>`<td${i===3?' class="pick"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="oneline"><b>The one-liner</b>${x.o}</div></div>`).join("")}
  </section>

  <section>
    <div class="eyebrow">Drill</div>
    <h2>${t.qs.length} questions, answers hidden</h2>
    <p class="lede">Filter by role above, rate yourself, then re-drill what's weak. Every question carries its source.</p>
    <div class="qlist" id="qlist"></div>
    <div class="empty" id="empty" hidden>Nothing matches that filter.</div>

  <section>
    <div class="eyebrow">Self-check</div>
    <h2>Rapid fire</h2>
    <p class="lede">Answer out loud, then click. More than five seconds and it goes back on the pile.</p>
    <div id="sclist">${t.self.map((s,i)=>`<div class="sc" data-i="${i}" tabindex="0" role="button" aria-expanded="false">
      <div class="sc-q"><span class="n">${String(i+1).padStart(2,"0")}</span><span>${esc(s[0])}</span></div>
      <div class="sc-a">${esc(s[1])}</div></div>`).join("")}</div>
  </section>

  <footer>
    <div>Full written version: <code>${t.md}</code></div>
    <div class="persist" id="persist">progress: local to this browser</div>

function qCardsHTML(tid){
  return ALL_Q.filter(q=>q.tid===tid).map(q=>`<article class="q" data-qid="${q.qid}" data-roles="${q.r.join(" ")}">
    <button class="q-head" aria-expanded="false">
      <span class="q-n">${q.tid}·${String(q.n).padStart(2,"0")}</span>
      <span class="q-t">${esc(q.q)}</span>
      <span class="q-tags">${q.r.map(r=>`<span class="tag${r==="core"?" core":""}">${ROLE_LABEL[r]}</span>`).join("")}</span>
    </button>
    <div class="q-body">
      <div class="ans">${q.a}</div>
      ${q.s?`<div class="srcs">${q.s.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n} &#8599;</a>`).join("")}</div>`:""}
      <div class="score"><span>Rate yourself</span>
        <button class="sbtn" data-v="got">Got it</button>
        <button class="sbtn" data-v="shaky">Shaky</button>
        <button class="sbtn" data-v="missed">Missed</button>
      </div>
    </div></article>`).join("");
}

function render(){
  const main=document.getElementById("main");
  if(tab==="overview"){ main.innerHTML=overviewHTML(); }
  else{
    const t=SERIES.find(x=>x.id===tab);
    main.innerHTML=tutorialHTML(t);
    document.getElementById("qlist").innerHTML=qCardsHTML(t.id);
  }
  document.querySelectorAll(".tab").forEach(b=>
    b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  wire(); paint(); drawDiagrams(); window.scrollTo({top:0,behavior:"instant"});
}

function wire(){
  document.querySelectorAll("[data-goto]").forEach(b=>
    b.addEventListener("click",()=>{tab=b.dataset.goto; render();}));
  const ql=document.getElementById("qlist");
  if(ql) ql.addEventListener("click",e=>{
    const head=e.target.closest(".q-head");
    if(head){ const c=head.closest(".q");
      head.setAttribute("aria-expanded",String(c.classList.toggle("is-open"))); return; }
    const btn=e.target.closest(".sbtn");
    if(btn){ const id=btn.closest(".q").dataset.qid;
      scores[id]=scores[id]===btn.dataset.v?undefined:btn.dataset.v;
      if(!scores[id]) delete scores[id];
      persist(); paint(); }
  });
  document.querySelectorAll(".got-c, .sc").forEach(el=>{
    const go=()=>el.setAttribute("aria-expanded",String(el.classList.toggle("is-open")));
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} });
  });
}

function paint(){
  let g=0,s=0,m=0;
  ALL_Q.forEach(q=>{ const v=scores[q.qid];
    if(v==="got")g++; else if(v==="shaky")s++; else if(v==="missed")m++; });
  const tot=ALL_Q.length;
  document.getElementById("n-got").textContent=g;
  document.getElementById("n-shaky").textContent=s;
  document.getElementById("n-missed").textContent=m;
  document.getElementById("n-left").textContent=tot-g-s-m;
  document.getElementById("bar-got").style.width=(g/tot*100)+"%";
  document.getElementById("bar-shaky").style.width=(s/tot*100)+"%";
  document.getElementById("bar-missed").style.width=(m/tot*100)+"%";
  document.querySelectorAll(".q").forEach(el=>{
    const v=scores[el.dataset.qid];
    if(v) el.dataset.score=v; else el.removeAttribute("data-score");
    el.querySelectorAll(".sbtn").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  });
  filter();
}

function filter(){
  const els=[...document.querySelectorAll(".q")];
  if(!els.length) return;
  let shown=0;
  els.forEach(el=>{
    const okRole = role==="all" || el.dataset.roles.split(" ").includes(role);
    const v=scores[el.dataset.qid];
    const okWeak = !weakOnly || v==="shaky" || v==="missed" || !v;
    const ok=okRole&&okWeak; el.hidden=!ok; if(ok)shown++;
  });
  const e=document.getElementById("empty"); if(e) e.hidden=shown>0;
}

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return; tab=b.dataset.tab; render();
});
document.querySelectorAll(".chip[data-role]").forEach(c=>
  c.addEventListener("click",()=>{ role=c.dataset.role;
    document.querySelectorAll(".chip[data-role]").forEach(o=>
      o.setAttribute("aria-pressed",String(o===c)));
    filter(); }));
document.getElementById("weak-only").addEventListener("click",e=>{
  weakOnly=!weakOnly; e.currentTarget.setAttribute("aria-pressed",String(weakOnly)); filter(); });
document.getElementById("collapse").addEventListener("click",()=>
  document.querySelectorAll(".q.is-open").forEach(c=>{
    c.classList.remove("is-open");
    c.querySelector(".q-head").setAttribute("aria-expanded","false"); }));
document.getElementById("reset").addEventListener("click",()=>{ scores={}; persist(); paint(); });

render();

/* durable progress when available, localStorage otherwise */
(async()=>{
  if(!window.claude||!claude.use) return;
  try{
    const d=await claude.use("db"); if(!d) return; db=d;
    const snap=await d.doc("progress/self_scores").get();
    if(snap&&snap.scores&&Object.keys(scores).length===0){ scores=snap.scores; paint(); }
    const el=document.getElementById("persist");
    if(el) el.textContent="progress: synced across devices";
  }catch(e){}
})();
</script>
